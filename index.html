<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafcff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1420" />
    <title>LuxStage — Generative 3D Playground & Staging Toolkit</title>
    <meta name="description" content="An interactive generative 3D playground and staging toolkit powered by Aholo Lux3D and React Three Fiber." />
    <meta property="og:title" content="LuxStage — Generative 3D Playground & Staging Toolkit" />
    <meta property="og:description" content="Generate, inspect, split, and stage interactive 3D models with Aholo Lux3D." />
    <meta property="og:image" content="/luxstage-icon.svg?v=4" />

    <!-- Favicon & Touch Icons (Matches Navbar LuxStage Logo) -->
    <link rel="icon" type="image/svg+xml" href="/luxstage-icon.svg?v=4" />
    <link rel="apple-touch-icon" href="/luxstage-icon.svg?v=4" />

    <!-- Apply device/system theme before React renders to prevent flash -->
    <script>
      try {
        var stored = localStorage.getItem('sk-theme');
        var isDark = (stored === 'dark') || (!stored);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
