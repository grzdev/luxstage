<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafcff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1420" />
    <title>LuxStage — Generative 3D Playground & Staging Toolkit</title>
    <meta name="description" content="An interactive generative 3D playground and staging toolkit powered by Aholo Lux3D and React Three Fiber." />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-v2.png" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />

    <!-- Apply device/system theme before React renders to prevent flash -->
    <script>
      try {
        var stored = localStorage.getItem('sk-theme');
        var isDark = (stored === 'dark') || (!stored);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
