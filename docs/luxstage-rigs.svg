<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" fill="none">
  <defs>
    <linearGradient id="rigBg" x1="0" y1="0" x2="960" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050912" />
      <stop offset="100%" stop-color="#0a1222" />
    </linearGradient>
    <linearGradient id="coneGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="960" height="210" rx="14" fill="url(#rigBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Panel 1: Semantic Part Split -->
  <g transform="translate(18 18)">
    <rect width="296" height="174" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="18" y="28" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">SEMANTIC PART SPLIT</text>
    <text x="18" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Lid · Jug · Handle · Blades · Cushions</text>
    <!-- Vector Guide Lines -->
    <line x1="148" y1="88" x2="148" y2="68" stroke="#38bdf8" stroke-opacity="0.45" stroke-dasharray="3 3" />
    <line x1="176" y1="112" x2="206" y2="112" stroke="#58ddba" stroke-opacity="0.45" stroke-dasharray="3 3" />
    <!-- Central Chamber -->
    <rect x="128" y="90" width="40" height="44" rx="6" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-width="1.4" />
    <!-- Animated Lid Lifting Up -->
    <rect x="130" y="72" width="36" height="10" rx="4" fill="#58ddba" fill-opacity="0.3" stroke="#58ddba" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
    <!-- Animated Side Handle Sliding Right -->
    <path d="M174 98 h10 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-10" stroke="#f8fafc" stroke-width="2" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 0; 0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </path>
    <!-- Animated Base Dropping Down -->
    <rect x="124" y="138" width="48" height="16" rx="5" fill="#64748b" fill-opacity="0.35" stroke="#94a3b8" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
  </g>

  <!-- Panel 2: 360 Spotlight & Flight Gimbal -->
  <g transform="translate(332 18)">
    <rect width="296" height="174" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="18" y="28" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">SPOTLIGHT &amp; FLIGHT GIMBAL</text>
    <text x="18" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">360° Darkroom Beam + Target Lock</text>
    <!-- Animated Spotlight Cone Sweep -->
    <g transform="translate(148 56)">
      <polygon points="0,0 -44,98 44,98" fill="url(#coneGrad)">
        <animateTransform attributeName="transform" type="rotate" values="-22 0 0; 22 0 0; -22 0 0" dur="5.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
      </polygon>
    </g>
    <!-- Reticle Crosshair Lock -->
    <circle cx="148" cy="118" r="22" stroke="#58ddba" stroke-width="1.3" stroke-dasharray="6 4">
      <animate attributeName="r" values="20;24;20" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <polygon points="148,104 162,118 148,132 134,118" fill="#38bdf8" fill-opacity="0.25" stroke="#f8fafc" stroke-width="1.3" />
    <text x="148" y="158" text-anchor="middle" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="9.5" font-weight="700">● TARGET LOCKED · 60FPS</text>
  </g>

  <!-- Panel 3: Material Lab & Section Slicer -->
  <g transform="translate(646 18)">
    <rect width="296" height="174" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="18" y="28" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">MATERIAL LAB &amp; SLICER</text>
    <text x="18" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">6 Shader Modes · Real-Time X/Y/Z Clip</text>
    <!-- Sliced Geometry Wireframe -->
    <polygon points="148,66 184,86 184,126 148,144 112,126 112,86" fill="#0ea5e9" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.3" />
    <!-- Animated Clipping Plane -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -20; 0 20; 0 -20" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
      <rect x="98" y="103" width="100" height="4" rx="2" fill="#58ddba" fill-opacity="0.85" />
    </g>
    <!-- 6 Shader Swatches -->
    <g transform="translate(66 154)">
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      <circle cx="32" cy="0" r="5" fill="#0ea5e9" stroke="#f8fafc" stroke-width="1" />
      <circle cx="64" cy="0" r="5" fill="#94a3b8" />
      <circle cx="96" cy="0" r="5" fill="#f8fafc" />
      <circle cx="128" cy="0" r="5" fill="#2dd4bf" />
      <circle cx="160" cy="0" r="5" fill="#bae6fd" />
    </g>
  </g>
</svg>
