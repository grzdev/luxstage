<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="100%" fill="none">
  <defs>
    <linearGradient id="rigWrapBg" x1="0" y1="0" x2="960" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050912" />
      <stop offset="100%" stop-color="#0a1222" />
    </linearGradient>
    <linearGradient id="beamCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="960" height="362" rx="16" fill="url(#rigWrapBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- ROW 1: Card 1 - Generative Studio -->
  <g transform="translate(20 18)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">✦ GENERATIVE STUDIO</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Text &amp; 2D Image-to-3D</text>
    <!-- Prompt Bar -> Glowing Node -> Cube -->
    <rect x="28" y="72" width="54" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <line x1="36" y1="84" x2="72" y2="84" stroke="#58ddba" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
    <circle cx="102" cy="84" r="3" fill="#58ddba">
      <animate attributeName="cx" values="90;124;90" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <polygon points="156,62 178,74 178,96 156,108 134,96 134,74" fill="#58ddba" fill-opacity="0.14" stroke="#58ddba" stroke-width="1.4" />
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">G1-Turbo · 7 Styles · Library</text>
  </g>

  <!-- ROW 1: Card 2 - Material Lab -->
  <g transform="translate(254 18)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">✦ MATERIAL LAB</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">6 Shaders &amp; Live PBR Sliders</text>
    <!-- 6 Swatch Dots -->
    <g transform="translate(34 86)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" />
      <circle cx="30" cy="0" r="8" fill="#0ea5e9" stroke="#f8fafc" stroke-width="1.5">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="0" r="8" fill="#94a3b8" />
      <circle cx="90" cy="0" r="8" fill="#f8fafc" />
      <circle cx="120" cy="0" r="8" fill="#2dd4bf" />
      <circle cx="150" cy="0" r="8" fill="#bae6fd" fill-opacity="0.7" />
    </g>
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">PBR · X-Ray · Chrome · Glass</text>
  </g>

  <!-- ROW 1: Card 3 - Spotlight -->
  <g transform="translate(488 18)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">🔦 SPOTLIGHT RIG</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">360° Darkroom Beam Orbit</text>
    <g transform="translate(109 54)">
      <polygon points="0,0 -32,62 32,62" fill="url(#beamCone)">
        <animateTransform attributeName="transform" type="rotate" values="-22 0 0; 22 0 0; -22 0 0" dur="4.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
      </polygon>
    </g>
    <polygon points="109,84 123,98 109,112 95,98" fill="#fbbf24" fill-opacity="0.22" stroke="#fde68a" stroke-width="1.3" />
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">Orbit Dial · Height · Beam</text>
  </g>

  <!-- ROW 1: Card 4 - Flight Gimbal -->
  <g transform="translate(722 18)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">🎯 FLIGHT GIMBAL</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">2-Axis Joystick Target Lock</text>
    <circle cx="109" cy="86" r="22" stroke="#58ddba" stroke-width="1.4" stroke-dasharray="6 4">
      <animate attributeName="r" values="19;24;19" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <line x1="81" y1="86" x2="93" y2="86" stroke="#58ddba" stroke-width="1.3" />
    <line x1="125" y1="86" x2="137" y2="86" stroke="#58ddba" stroke-width="1.3" />
    <polygon points="109,75 120,86 109,97 98,86" fill="#38bdf8" fill-opacity="0.25" stroke="#f8fafc" stroke-width="1.3" />
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">● TARGET LOCKED · 60FPS</text>
  </g>

  <!-- ROW 2: Card 5 - Semantic Part Split -->
  <g transform="translate(20 190)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">🧩 PART SPLIT</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Anatomy-Aware Explode</text>
    <!-- Blender Jug + Lifting Lid + Sliding Handle -->
    <rect x="92" y="72" width="32" height="34" rx="5" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-width="1.3" />
    <rect x="94" y="60" width="28" height="7" rx="3" fill="#58ddba" fill-opacity="0.3" stroke="#58ddba" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
    <path d="M128 78 h7 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-7" stroke="#f8fafc" stroke-width="1.8" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0; 11 0; 0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </path>
    <rect x="90" y="110" width="36" height="10" rx="4" fill="#64748b" fill-opacity="0.35" stroke="#94a3b8" stroke-width="1.1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">Blender · Drone · Headphones</text>
  </g>

  <!-- ROW 2: Card 6 - Spatial Rig -->
  <g transform="translate(254 190)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">📐 SPATIAL RIG</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">CAD Cage · Zero-G · Export</text>
    <!-- Bounding Cage + Floating Cube -->
    <rect x="77" y="58" width="64" height="58" rx="4" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.1" stroke-dasharray="4 3" />
    <rect x="93" y="72" width="32" height="30" rx="5" fill="#38bdf8" fill-opacity="0.18" stroke="#58ddba" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 -4; 0 4; 0 -4" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">W×H×D · Gravity · R3F / GLB</text>
  </g>

  <!-- ROW 2: Card 7 - Studio Mode -->
  <g transform="translate(488 190)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">🎨 STUDIO STAGE</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Environments &amp; Snapshots</text>
    <!-- Backdrop Swatches + Camera Shutter Ring -->
    <circle cx="82" cy="86" r="14" fill="#0ea5e9" fill-opacity="0.28" stroke="#38bdf8" stroke-width="1.3" />
    <circle cx="109" cy="86" r="14" fill="#f59e0b" fill-opacity="0.24" stroke="#fbbf24" stroke-width="1.3" />
    <circle cx="136" cy="86" r="14" fill="#58ddba" fill-opacity="0.24" stroke="#58ddba" stroke-width="1.3">
      <animate attributeName="fill-opacity" values="0.2;0.55;0.2" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">Showroom · Cyber · PNG Shot</text>
  </g>

  <!-- ROW 2: Card 8 - Section Slicer -->
  <g transform="translate(722 190)">
    <rect width="218" height="154" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#58ddba" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">✂️ SECTION SLICER</text>
    <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Live Cross-Section Plane</text>
    <polygon points="109,58 139,74 139,102 109,118 79,102 79,74" fill="#0ea5e9" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.3" />
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -14; 0 14; 0 -14" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
      <rect x="65" y="86" width="88" height="3.5" rx="1.8" fill="#58ddba" fill-opacity="0.9" />
    </g>
    <text x="16" y="138" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="10">Z · X · Y WebGL Clipping</text>
  </g>
</svg>
